[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "three-tier-memory-engine"
version = "0.5.1"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
api = ["fastapi>=0.144,<0.145", "uvicorn>=0.54,<0.55"]
dev = ["pytest>=8,<10", "httpx>=0.28,<0.29", "ruff>=0.14,<1"]
[project.scripts]
memory-engine = "memory_engine.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
memory_engine = ["migrations/*.sql"]
[tool.pytest.ini_options]
pythonpath = ["src", "../dynamic-context-assembler/src"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
